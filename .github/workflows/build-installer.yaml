name: Build Custom Installer

on:
  push:
    branches: [release-1.12-canlin]
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Kernel image tag from talos-pkgs'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  TALOS_VERSION: v1.12.2

jobs:
  build-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Note: GITHUB_TOKEN cannot read packages from other repos in the org.
      # For now, the kernel package in talos-pkgs must be public, or use a PAT.
      # To make public: gh api --method PATCH /orgs/NebulaTechSolutions/packages/container/kernel -f visibility=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get kernel tag
        id: kernel
        run: |
          INPUT_TAG="${{ github.event.inputs.kernel_tag }}"
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "latest" ] && [ "$INPUT_TAG" != "" ]; then
            TAG="$INPUT_TAG"
          else
            # Default to latest known kernel tag from talos-pkgs
            # Update this when building new kernels
            TAG="a77bd43"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using kernel tag: $TAG"

      - name: Build all required images
        run: |
          mkdir -p _out
          # Build imager and installer-base first, then installer
          # Use our custom kernel from talos-pkgs
          make docker-imager \
            PLATFORM=linux/amd64 \
            PKG_KERNEL=ghcr.io/nebulatechsolutions/kernel:${{ steps.kernel.outputs.tag }} \
            DEST=_out \
            PUSH=false

          # Load the imager into Docker
          docker load -i _out/imager.tar

          make docker-installer-base \
            PLATFORM=linux/amd64 \
            PKG_KERNEL=ghcr.io/nebulatechsolutions/kernel:${{ steps.kernel.outputs.tag }} \
            DEST=_out \
            PUSH=false

          # Load installer-base into Docker
          docker load -i _out/installer-base.tar
        timeout-minutes: 90

      - name: Build installer
        run: |
          make installer \
            PLATFORM=linux/amd64 \
            PKG_KERNEL=ghcr.io/nebulatechsolutions/kernel:${{ steps.kernel.outputs.tag }} \
            PUSH=false
        timeout-minutes: 30

      - name: Save installer image
        run: |
          mkdir -p _out
          ls -la _out/ || true
          # The installer tar should be in _out
          if [ -f _out/installer-amd64.tar ]; then
            ls -lh _out/installer-amd64.tar
          else
            echo "Installer tar not found, checking for images..."
            docker images | grep -i installer
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: talos-installer-canlin-${{ env.TALOS_VERSION }}
          path: _out/installer-amd64.tar
          retention-days: 30

      - name: Push installer to registry
        if: github.event_name == 'push'
        run: |
          make installer \
            PLATFORM=linux/amd64 \
            PKG_KERNEL=ghcr.io/nebulatechsolutions/kernel:${{ steps.kernel.outputs.tag }} \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ github.repository_owner }}
