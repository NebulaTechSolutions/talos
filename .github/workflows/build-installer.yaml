name: Build Custom Installer

on:
  push:
    branches: [release-1.12-canlin]
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Kernel image tag from talos-pkgs'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  TALOS_VERSION: v1.12.2

jobs:
  build-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Note: GITHUB_TOKEN cannot read packages from other repos in the org.
      # For now, the kernel package in talos-pkgs must be public, or use a PAT.
      # To make public: gh api --method PATCH /orgs/NebulaTechSolutions/packages/container/kernel -f visibility=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install crane
        run: |
          VERSION=$(curl -s "https://api.github.com/repos/google/go-containerregistry/releases/latest" | jq -r '.tag_name')
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xzf - crane
          sudo mv crane /usr/local/bin/
          crane version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get kernel tag
        id: kernel
        run: |
          INPUT_TAG="${{ github.event.inputs.kernel_tag }}"
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "latest" ] && [ "$INPUT_TAG" != "" ]; then
            TAG="$INPUT_TAG"
          else
            # Default to latest known kernel tag from talos-pkgs
            # Update this when building new kernels
            TAG="a77bd43"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using kernel tag: $TAG"

      - name: Get version info
        id: version
        run: |
          # Use lowercase for registry paths
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Use short SHA as tag
          TAG=$(git rev-parse --short HEAD)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Registry: ${{ env.REGISTRY }}/$OWNER"
          echo "Tag: $TAG"

      - name: Build and push imager
        run: |
          # Build imager and push to registry
          # INSTALLER_ARCH=targetarch ensures we only build for amd64, not arm64
          make registry-imager \
            PLATFORM=linux/amd64 \
            INSTALLER_ARCH=targetarch \
            PKG_KERNEL=ghcr.io/nebulatechsolutions/kernel:${{ steps.kernel.outputs.tag }} \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ steps.version.outputs.owner }}
        timeout-minutes: 60

      - name: Build and push installer-base
        run: |
          make registry-installer-base \
            PLATFORM=linux/amd64 \
            INSTALLER_ARCH=targetarch \
            PKG_KERNEL=ghcr.io/nebulatechsolutions/kernel:${{ steps.kernel.outputs.tag }} \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ steps.version.outputs.owner }}
        timeout-minutes: 30

      - name: Build and push installer
        run: |
          # Build installer, push to registry with crane
          # Note: The 'installer' target uses crane to push and then deletes the local tar
          make installer \
            PLATFORM=linux/amd64 \
            INSTALLER_ARCH=targetarch \
            PKG_KERNEL=ghcr.io/nebulatechsolutions/kernel:${{ steps.kernel.outputs.tag }} \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ steps.version.outputs.owner }}
        timeout-minutes: 30

      - name: Export installer for artifact
        run: |
          # Fix permissions on _out (created by Docker container as root)
          sudo chown -R $USER:$USER _out || true
          mkdir -p _out
          # Get the image tag that was pushed
          TAG=$(git describe --tag --always --dirty --match 'v[0-9]*')
          INSTALLER_IMAGE="${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/installer:${TAG}"
          echo "Exporting $INSTALLER_IMAGE"
          # Pull and save as tar for artifact
          crane pull "$INSTALLER_IMAGE" _out/installer-amd64.tar
          ls -lh _out/installer-amd64.tar

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: talos-installer-canlin-${{ env.TALOS_VERSION }}
          path: _out/installer-amd64.tar
          retention-days: 30
